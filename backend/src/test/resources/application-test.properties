# Isolated test profile — H2 in-memory ONLY. Never points at Neon/production.
spring.datasource.url=jdbc:h2:mem:democleanup;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.defer-datasource-initialization=true

# Do NOT run main/resources data.sql against H2 (avoids product inserts & Neon-only SQL)
spring.sql.init.mode=never

# Prevent scheduled cleanup from firing during tests (we call the method directly)
spring.task.scheduling.enabled=false

# Dummy JWT secret for SecurityConfig beans (tests do not hit Neon)
jwt.secret=test-only-demo-cleanup-secret-key-at-least-32-chars
